<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sweet River Escape | Jamaican Lotería</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header class="header"><div class="brand">Sweet River Escape</div><div class="subtitle">JAMAICAN LOTERÍA</div><div class="meta">A celebration of Jamaican culture</div></header><section class="panel"><div id="status" class="status">Connecting to the live game…</div><div id="board" class="board hidden"></div><div id="win" class="win hidden">🎉 LOTERÍA! Show your board ID to the organizer for verification.</div><div id="join" class="hidden"><button id="joinBtn" class="primary">Get my playing board</button></div><div id="message" class="notice hidden"></div></section><div class="foot">Sweet River Escape · Guest playing board</div></main><script type="module">
const names=['Patty','Ackee & Saltfish','Jerk Chicken','Sorrel','Curry Goat','Black Cake','Festival','Scotch Bonnet','Jelly Coconut','Reggae','Dancehall','Sound System','Bob Marley','Steel Pan','Selector','Dominoes','Jamaican Flag','Grand Market','Cricket','Football','Jonkonnu','Dutch Pot','Doctor Bird','Blue Mountains','Dunn’s River Falls','Seven Mile Beach','Hibiscus','Ackee Fruit','Banana Tree','Cook Shop','Fruit Stand','Fishing Boat','Verandah','School Days','Breadfruit','Red Stripe'];
const $=x=>document.getElementById(x);let board=null,game={called:[],started:false},busy=false;const path='/.netlify/functions/';
async function api(route,data){const r=await fetch(path+route,{method:data?'POST':'GET',headers:{'content-type':'application/json'},body:data?JSON.stringify(data):undefined,cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
const lines=()=>{let a=[];for(let i=0;i<4;i++){a.push([0,1,2,3].map(j=>i*4+j));a.push([0,1,2,3].map(j=>j*4+i))}return [...a,[0,5,10,15],[3,6,9,12]]};
function showError(s){$('message').textContent=s;$('message').classList.remove('hidden')}
function render(){if(!board){$('board').classList.add('hidden');$('join').classList.toggle('hidden',game.started);$('status').textContent=game.started?'Game in progress. New boards are closed.':'Welcome! Get your board before the organizer starts the game.';return}
 $('join').classList.add('hidden');$('board').classList.remove('hidden');$('status').textContent='Board '+board.id+' · '+board.marked.length+' of 16 marked · '+game.called.length+' cards called'+(game.started?' · Game live':' · Waiting for organizer');const root=$('board');root.replaceChildren();for(const id of board.cards){const marked=board.marked.includes(id),called=game.called.includes(id);const b=document.createElement('button');b.className='tile'+(marked?' marked':'')+(called?' called':'');b.disabled=!called||marked||busy;b.setAttribute('aria-label',names[id-1]+(marked?' marked':called?' called':' not yet called'));b.setAttribute('aria-pressed',marked);const img=document.createElement('img');img.src='/cards/'+String(id).padStart(2,'0')+'.webp';img.alt=names[id-1];b.append(img);b.onclick=async()=>{if(busy)return;busy=true;try{board=await api('board',{action:'mark',id:board.id,card:id});$('message').classList.add('hidden')}catch(e){showError(e.message)}finally{busy=false;render()}};root.append(b)}$('win').classList.toggle('hidden',!lines().some(l=>l.every(i=>board.marked.includes(board.cards[i]))))}
async function refresh(){try{game=await api('game');const id=localStorage.getItem('sre_board_live_id');if(id){try{board=await api('board',{action:'load',id})}catch{localStorage.removeItem('sre_board_live_id');board=null}}$('message').classList.add('hidden');render()}catch(e){showError('Unable to connect: '+e.message)}}
$('joinBtn').onclick=async()=>{if(busy)return;busy=true;$('joinBtn').disabled=true;try{board=await api('board',{action:'create'});localStorage.setItem('sre_board_live_id',board.id);render()}catch(e){showError(e.message)}finally{busy=false;$('joinBtn').disabled=false}};
await refresh();setInterval(refresh,4000);
</script></body></html>
